name: Format

on:
  push:
    branches: [main]
    paths:
      - '.clang-format'
      - 'include/**/*.h'
      - 'include/**/*.hpp'
      - 'src/**/*.cpp'
      - '.github/workflows/format.yml'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '.clang-format'
      - 'include/**/*.h'
      - 'include/**/*.hpp'
      - 'src/**/*.cpp'
      - '.github/workflows/format.yml'
  workflow_dispatch:

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Apply clang-format
        run: |
          find include src -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -exec clang-format -i {} +

      - name: Commit and push changes
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git add -- include src
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply clang-format"
          git push origin "HEAD:${TARGET_BRANCH}"
